<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#222127" />
  <title>A Wild Gift Appears! — Gubby</title>
  <style>
    :root{color-scheme:dark;--bg:#232228;--off:#f9f8fb;--muted:#aaa9af;--yellow:#f6f45c}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body{background:var(--bg);color:var(--off);overflow-x:hidden}
    .shell{width:min(100%,1530px);margin:auto;padding:45px 43px 20px;min-height:100vh;display:flex;flex-direction:column}
    .heading{font-size:clamp(23px,3.65vw,54px);font-weight:800;letter-spacing:.048em;line-height:1.14;color:#8e8d90;margin:0 0 45px 6px;text-transform:uppercase}
    .gift-row{display:flex;gap:42px;align-items:center;min-width:0}
    .avatar{flex:0 0 auto;width:clamp(145px,18.35vw,280px);height:auto;aspect-ratio:280/263;object-fit:contain;border-radius:30px;filter:drop-shadow(0 0 0 transparent);cursor:pointer;user-select:none;-webkit-user-drag:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .3s}
    .avatar:hover,.avatar:focus-visible{transform:rotate(-4deg) scale(1.045);filter:drop-shadow(0 14px 20px #0004);outline:none}
    .avatar.poke{animation:boing .65s ease}
    @keyframes boing{0%,100%{transform:scale(1)}30%{transform:scale(.88,1.08) rotate(-6deg)}60%{transform:scale(1.1,.94) rotate(5deg)}}
    .detail{min-width:0;margin-top:-4px}
    .name-row{display:flex;align-items:center;gap:19px;flex-wrap:wrap}
    .name{font-size:clamp(53px,6.1vw,91px);font-weight:400;line-height:1.07;letter-spacing:-.045em}
    .code{font-size:clamp(24px,3.8vw,59px);font-weight:600;letter-spacing:-.045em;line-height:1.25;padding:12px 27px 13px;border-radius:31px;background:linear-gradient(115deg,#69686a,#a7a6aa);white-space:nowrap}
    .expires{font-size:clamp(29px,4.1vw,61px);line-height:1.2;color:#a4a3a6;margin:10px 0 0;letter-spacing:-.02em}
    .spacer{flex:1;min-height:56px}
    .accept{appearance:none;display:flex;align-items:center;justify-content:center;gap:26px;border:0;width:100%;min-height:184px;padding:18px 25px;border-radius:31px;cursor:pointer;color:white;background:linear-gradient(105deg,#69686b 0%,#929194 100%);font:700 clamp(36px,4.1vw,61px)/1.1 Arial,Helvetica,sans-serif;letter-spacing:.035em;transition:filter .2s,transform .2s,box-shadow .25s;box-shadow:none;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
    .accept::after{content:"";position:absolute;width:40%;height:200%;left:-65%;top:-50%;background:linear-gradient(90deg,transparent,#fff2,transparent);transform:rotate(20deg);transition:left .55s}
    .accept:hover::after{left:125%}
    .accept:hover{filter:brightness(1.14);box-shadow:0 15px 45px #0002;transform:translateY(-2px)}
    .accept:active{transform:scale(.985)}
    .accept:focus-visible,.replay:focus-visible,.close:focus-visible{outline:3px solid var(--yellow);outline-offset:5px}
    .sparkles{position:relative;display:inline-block;width:68px;height:68px;flex:0 0 68px}
    .sparkles i{position:absolute;background:var(--yellow);clip-path:polygon(50% 0,63% 35%,100% 50%,63% 65%,50% 100%,37% 65%,0 50%,37% 35%)}
    .sparkles i:nth-child(1){width:52px;height:52px;left:14px;top:6px}
    .sparkles i:nth-child(2){width:22px;height:22px;left:1px;top:5px}
    .sparkles i:nth-child(3){width:23px;height:23px;left:0;top:40px}
    .accept:hover .sparkles{animation:twinkle .7s ease infinite alternate}
    @keyframes twinkle{to{transform:scale(1.16) rotate(13deg)}}
    .overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:rgba(12,11,19,.7);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
    .overlay.open{opacity:1;visibility:visible}
    .result{width:min(100%,560px);border-radius:32px;padding:35px 32px 33px;text-align:center;background:linear-gradient(145deg,#414047 0%,#29282f 80%);border:1px solid #ffffff2a;box-shadow:0 30px 120px #0007;position:relative;transform:translateY(24px) scale(.92);transition:transform .5s cubic-bezier(.17,1.5,.5,1)}
    .overlay.open .result{transform:translateY(0) scale(1)}
    .close{position:absolute;right:18px;top:15px;font:28px/1 Arial;background:transparent;border:0;color:#bbb;cursor:pointer;padding:9px 13px}
    .result-icon{width:min(48vw,198px);border-radius:26px;display:block;margin:0 auto 18px;filter:drop-shadow(0 9px 25px #0005);animation:float 2.5s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-9px) rotate(3deg)}}
    .mini-stars{font-size:30px;color:var(--yellow);letter-spacing:8px;margin-bottom:12px}
    .result h2{font-size:clamp(34px,7vw,51px);line-height:1.07;margin:3px 0 8px}
    .result .congrats{font-size:20px;color:#dedde2;margin:0 0 17px}
    .result .disclaimer{font-size:13px;color:#aaa9b0;line-height:1.45;margin:0 0 24px}
    .replay{border:0;color:#242329;background:var(--yellow);border-radius:17px;font-size:18px;font-weight:800;padding:16px 40px;cursor:pointer;transition:transform .2s,filter .2s}
    .replay:hover{transform:translateY(-2px);filter:brightness(1.08)}
    #confetti{position:fixed;inset:0;z-index:20;width:100%;height:100%;pointer-events:none}
    @media(max-width:720px){
      .shell{min-height:100svh;padding:28px 22px 26px}
      .heading{font-size:clamp(23px,5.4vw,38px);margin:0 0 36px 0}
      .gift-row{gap:19px;align-items:center}
      .avatar{width:clamp(115px,31vw,195px);border-radius:20px}
      .name-row{gap:7px 10px}
      .name{font-size:clamp(42px,10vw,70px)}
      .code{font-size:clamp(19px,5vw,35px);padding:7px 14px 9px;border-radius:17px}
      .expires{font-size:clamp(19px,5vw,33px);margin-top:13px}
      .spacer{min-height:35px}
      .accept{min-height:123px;border-radius:25px;font-size:40px;gap:14px}
      .sparkles{transform:scale(.76);margin-right:-5px;flex-basis:55px;width:55px}
    }
    @media(max-width:450px){.shell{padding:26px 17px 22px}.heading{margin-bottom:28px}.gift-row{gap:14px}.avatar{width:120px}.name{font-size:41px}.code{font-size:20px;padding:6px 12px}.expires{font-size:20px}.accept{min-height:110px;font-size:35px}}
    @media(max-width:340px){.avatar{width:90px}.name{font-size:35px}.expires{font-size:17px}.code{font-size:17px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>

      <h2 id="resultTitle">Gubby is yours!</h2>
      <p class="congrats">✨ Gift accepted! ✨</p>
      <p class="disclaimer">PS:Joey stinks</p>
      <button class="replay" id="replay" type="button">Open again ↻</button>
    </div>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script>
  (()=>{
    const accept=document.getElementById('accept');
    const overlay=document.getElementById('overlay');
    const close=document.getElementById('close');
    const replay=document.getElementById('replay');
    const gubby=document.getElementById('gubby');
    const expiry=document.getElementById('expiry');
    const canvas=document.getElementById('confetti');
    const ctx=canvas.getContext('2d');
    let particles=[],animationId=0,lastFocus=null, audioCtx;
    const storageKey='gubby-gift-first-open-v1';
    let firstOpen;
    try{firstOpen=Number(localStorage.getItem(storageKey));if(!firstOpen||firstOpen>Date.now()){firstOpen=Date.now();localStorage.setItem(storageKey,String(firstOpen));}}catch(e){firstOpen=Date.now();}
    function updateClock(){
      const remain=Math.max(0,43*3600000-(Date.now()-firstOpen));
      let hours=Math.ceil(remain/3600000);
      expiry.textContent=remain===0?'The gift awaits you!':`Expires in ${hours} ${hours===1?'hour':'hours'}`;
    }
    updateClock();setInterval(updateClock,60000);
    function poke(){gubby.classList.remove('poke');void gubby.offsetWidth;gubby.classList.add('poke');}
    gubby.addEventListener('click',poke);
    gubby.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();poke();}});
    function sound(){
      try{
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC)return;
        audioCtx=audioCtx||new AC();
        if(audioCtx.state==='suspended')audioCtx.resume();
        [523.25,659.25,783.99,1046.50].forEach((freq,i)=>{
          let osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=audioCtx.currentTime+.065*i;
          osc.type='sine';osc.frequency.setValueAtTime(freq,t);
          gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.085,t+.018);gain.gain.exponentialRampToValueAtTime(.0001,t+.32);
          osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.34);
        });
      }catch(e){}
    }
    function burst(){
      cancelAnimationFrame(animationId);
      const dpr=Math.min(window.devicePixelRatio||1,2), w=innerWidth,h=innerHeight;
      canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      const colors=['#fff','#f7f35f','#bcb5ff','#9de9ed','#f4a9d7','#9de4b4'];
      const count=matchMedia('(prefers-reduced-motion: reduce)').matches?0:160;
      particles=Array.from({length:count},()=>({x:w/2+(Math.random()-.5)*170,y:h*.52+(Math.random()-.5)*70,
        vx:(Math.random()-.5)*17,vy:-Math.random()*16-3,gravity:.19+Math.random()*.1,
        angle:Math.random()*6.28,va:(Math.random()-.5)*.21,sz:4+Math.random()*8,
        color:colors[Math.floor(Math.random()*colors.length)],life:80+Math.random()*70}));
      function frame(){
        ctx.clearRect(0,0,w,h);
        particles=particles.filter(p=>p.life-->0&&p.y<h+30);
        for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=.995;p.angle+=p.va;
          ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color;
          ctx.globalAlpha=Math.min(1,p.life/25);ctx.fillRect(-p.sz/2,-p.sz/3,p.sz,p.sz*.67);ctx.restore();}
        if(particles.length)animationId=requestAnimationFrame(frame);
        else ctx.clearRect(0,0,w,h);
      }
      frame();
    }
    function openGift(){lastFocus=document.activeElement;overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');
      document.body.style.overflow='hidden';close.focus();burst();sound();}
    function hideGift(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');
      document.body.style.overflow='';cancelAnimationFrame(animationId);ctx.clearRect(0,0,canvas.width,canvas.height);
      (lastFocus||accept).focus();}
    accept.addEventListener('click',openGift);
    close.addEventListener('click',hideGift);
    replay.addEventListener('click',()=>{hideGift();setTimeout(openGift,120)});
    overlay.addEventListener('click',e=>{if(e.target===overlay)hideGift();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))hideGift();});
  })();
  </script>
